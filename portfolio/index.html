<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArZen — Portfolio</title>
    <style>
      * { box-sizing: border-box; }
      html { font-size: clamp(14px, 1.2vw + 12px, 16px); }
      html, body { margin: 0; min-height: 100vh; height: 100%; font-family: system-ui, sans-serif; overflow: hidden; background: #18181b; }
      #root { min-height: 100vh; height: 100%; display: block; background: #18181b; }
      #root.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
      #root .loading-logo { font-size: 3rem; font-weight: 600; color: #fff; display: flex; gap: 2px; }
      #root .loading-logo span { display: inline-block; animation: bounce-char 0.6s ease-in-out infinite; }
      #root .loading-logo span:nth-child(1) { animation-delay: 0s; }
      #root .loading-logo span:nth-child(2) { animation-delay: 0.05s; }
      #root .loading-logo span:nth-child(3) { animation-delay: 0.1s; }
      #root .loading-logo span:nth-child(4) { animation-delay: 0.15s; }
      #root .loading-logo span:nth-child(5) { animation-delay: 0.2s; }
      #root .loading-logo span:nth-child(6) { animation-delay: 0.25s; color: #10b981; }
      @keyframes bounce-char { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      #root .loading-text { font-size: 1rem; color: #a1a1aa; display: flex; align-items: center; animation: bounce-char 0.6s ease-in-out infinite; }
      #root .loading-dots { display: inline-block; width: 0; overflow: hidden; vertical-align: bottom; animation: loading-dots 1.2s steps(4, end) infinite; }
      @keyframes loading-dots { 0% { width: 0; } 25% { width: 1ch; } 50% { width: 2ch; } 75% { width: 3ch; } 100% { width: 0; } }
      .app-wrapper { display: flex !important; flex-direction: column !important; min-height: 100vh !important; width: 100% !important; position: relative !important; z-index: 10 !important; }
      .app-layout { display: flex !important; flex: 1 !important; min-height: 0 !important; width: 100% !important; }
      .app-sidebar { position: fixed !important; top: 0 !important; bottom: 60px !important; left: 0 !important; width: 240px !important; min-width: 240px !important; background: rgba(24,24,27,0.95) !important; color: #fff !important; padding: 40px 20px 24px !important; border-right: 2px solid #52525b !important; overflow-y: auto !important; }
      .app-main { margin-left: 240px !important; flex: 1 !important; min-width: 0 !important; height: calc(100vh - 60px) !important; overflow: hidden !important; padding: 0 !important; background: rgba(24,24,27,0.95) !important; color: #e4e4e7 !important; }
      .app-footer { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; width: 100% !important; background: #18181b !important; border-top: 1px solid #3f3f46 !important; color: #71717a !important; z-index: 20 !important; }
      .hero-section { height: 100%; display: flex; flex-direction: column; justify-content: center; }
      .hero-links { margin-top: 1.25rem !important; }
    </style>
  </head>
  <body>
    <div id="root" class="loading">
      <div class="loading-logo"><span>A</span><span>r</span><span>Z</span><span>e</span><span>n</span><span>.</span></div>
      <div class="loading-text">Loading<span class="loading-dots">...</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
