<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arzen — Portfolio</title>
    <style>
      * { box-sizing: border-box; }
      html { font-size: clamp(14px, 1.2vw + 12px, 16px); }
      html, body { margin: 0; min-height: 100vh; height: 100%; font-family: system-ui, sans-serif; overflow: hidden; }
      #root { min-height: 100vh; height: 100%; display: block; }
      .app-wrapper { display: flex !important; flex-direction: column !important; min-height: 100vh !important; width: 100% !important; position: relative !important; z-index: 10 !important; }
      .app-layout { display: flex !important; flex: 1 !important; min-height: 0 !important; width: 100% !important; }
      .app-sidebar { position: fixed !important; top: 0 !important; bottom: 60px !important; left: 0 !important; width: 200px !important; min-width: 200px !important; background: rgba(24,24,27,0.95) !important; color: #fff !important; padding: 40px 20px 24px !important; border-right: 2px solid #52525b !important; overflow-y: auto !important; }
      .app-main { margin-left: 200px !important; flex: 1 !important; min-width: 0 !important; height: calc(100vh - 60px) !important; overflow: hidden !important; padding: 0 !important; background: rgba(24,24,27,0.95) !important; color: #e4e4e7 !important; }
      .app-footer { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; width: 100% !important; background: #18181b !important; border-top: 1px solid #3f3f46 !important; color: #71717a !important; z-index: 20 !important; }
      .hero-section { height: 100%; display: flex; flex-direction: column; justify-content: center; }
      .hero-links { margin-top: 1.25rem !important; }
    </style>
  </head>
  <body>
    <div id="root">
      <p style="padding: 20px; color: #a1a1aa;">Loading…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
